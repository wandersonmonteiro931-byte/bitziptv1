<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark only" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <title>WMCPLAYER</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #000000 !important;
        color-scheme: dark only;
      }
      body {
        background-color: #000000 !important;
      }
      img[src*="logo"], img[src*="pwa-"], img[src*="banners"], img[src*="banner"] {
        background-color: #000000 !important;
      }
    </style>

    <script>
      (function () {
        try {
          localStorage.removeItem('bitz_app_branding');
          var stored = localStorage.getItem('wmcplayer_app_branding_v2');
          if (!stored) return;
          var branding = JSON.parse(stored);
          var defaultIcon = '/app/wmcplayer-icon-512-v4.png';
          var legacyIconPattern = /(?:wmcplayer-(?:icon-(?:192|512)-v3|maskable-512-v3|apple-touch-v3|favicon-v3)\.(?:png|ico))(?:[?#].*)?$/i;
          var normalizeIcon = function (value, fallback) {
            var normalized = String(value || '').trim();
            if (!normalized) return fallback;
            return legacyIconPattern.test(normalized) ? defaultIcon : normalized;
          };
          var appName = (branding.appName || branding.app_name || 'WMCPLAYER').trim();
          var shortName = (branding.appShortName || branding.app_short_name || appName).trim();
          var description = (branding.appDescription || branding.app_description || (appName + ' - Programa Oficial de Fidelidade')).trim();
          var logo = normalizeIcon(branding.logoUrl || branding.app_logo_url, defaultIcon);
          var favicon = normalizeIcon(branding.faviconUrl || branding.app_favicon_url, logo);

          document.title = appName;
          document.documentElement.setAttribute('data-app-name', appName);

          window.__APP_BRANDING_BOOT__ = { appName: appName, appShortName: shortName, appDescription: description, logoUrl: logo, faviconUrl: favicon };
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="WMCPLAYER - Programa Oficial de Fidelidade" />
    <meta name="author" content="WMCPLAYER" />
    <meta name="application-name" content="WMCPLAYER" />
    <meta name="apple-mobile-web-app-title" content="WMCPLAYER" />
    <link rel="apple-touch-icon" href="/app/wmcplayer-apple-touch-v4.png" />
    <link rel="icon" href="/app/wmcplayer-icon-512-v4.png" type="image/png" />
    <link rel="shortcut icon" href="/app/wmcplayer-icon-512-v4.png" type="image/png" />

    <link rel="image_src" href="https://wmcplayer.pages.dev/app/wmcplayer-share-20260711.png" />
    <meta property="og:title" content="WMCPLAYER" />
    <meta property="og:description" content="WMCPLAYER - Programa Oficial de Fidelidade" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wmcplayer.pages.dev/app/" />
    <meta property="og:site_name" content="WMCPLAYER" />
    <meta property="og:image" content="https://wmcplayer.pages.dev/app/wmcplayer-share-20260711.png" />
    <meta property="og:image:secure_url" content="https://wmcplayer.pages.dev/app/wmcplayer-share-20260711.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="Logotipo oficial WMCPLAYER" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WMCPLAYER" />

    <meta name="twitter:image:alt" content="Logotipo oficial WMCPLAYER" />
  </head>

</html>

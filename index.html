<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark only" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>WMCFLIX</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #000000 !important;
        color-scheme: dark only;
      }
      body {
        background-color: #000000 !important;
      }
      img[src*="logo"], img[src*="pwa-"], img[src*="banners"], img[src*="banner"] {
        background-color: #000000 !important;
      }
    </style>

    <script>
      (function () {
        try {
          localStorage.removeItem('bitz_app_branding');
          var stored = localStorage.getItem('wmcflix_app_branding_v2');
          if (!stored) return;
          var branding = JSON.parse(stored);
          var appName = (branding.appName || branding.app_name || 'WMCFLIX').trim();
          var shortName = (branding.appShortName || branding.app_short_name || appName).trim();
          var description = (branding.appDescription || branding.app_description || (appName + ' - Programa de Fidelidade')).trim();
          var logo = (branding.logoUrl || branding.app_logo_url || '/pwa-512.png').trim();
          var favicon = (branding.faviconUrl || branding.app_favicon_url || logo).trim();

          document.title = appName;
          document.documentElement.setAttribute('data-app-name', appName);

          window.__APP_BRANDING_BOOT__ = { appName: appName, appShortName: shortName, appDescription: description, logoUrl: logo, faviconUrl: favicon };
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="WMCFLIX - Programa Oficial de Fidelidade" />
    <meta name="author" content="WMCFLIX" />
    <meta name="application-name" content="WMCFLIX" />
    <meta name="apple-mobile-web-app-title" content="WMCFLIX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/pwa-512.png" type="image/png" />
    <link rel="shortcut icon" href="/pwa-512.png" type="image/png" />

    <meta property="og:title" content="WMCFLIX" />
    <meta property="og:description" content="WMCFLIX - Programa Oficial de Fidelidade" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WMCFLIX" />
    <meta name="twitter:description" content="WMCFLIX - Programa Oficial de Fidelidade" />
    <meta name="twitter:image" content="/pwa-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
